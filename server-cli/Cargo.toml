[package]
name = "veldr-server-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[package.metadata.nix]
build = true
app = true
longDescription = """
Caldrayne Online is a multiplayer voxel action RPG for the Caldrayne project line.
It is a Caldrayne-branded derivative of the open-source Veloren codebase while preserving required upstream credit.
It is inspired by games such as Cube World, The Legend of Zelda: Breath of the Wild, Dwarf Fortress and Minecraft.

This package includes the Caldrayne Online server CLI.
"""

[features]
worldgen = ["server/worldgen"]
persistent_world = ["server/persistent_world"]
# needed to stay compatible with voxygens format
default-publish = ["default"]
default = ["worldgen", "persistent_world"]
tracy = ["common-frontend/tracy"]
plugins = ["server/plugins"]
hot-reloading = ["server/hot-reloading"]
hot-agent = ["server/hot-agent", "agent"]
hot-site = ["server/hot-site", "world"]

[dependencies]
server = { package = "veldr-server", path = "../server", default-features = false, features = [
    "simd",
] }
agent = { package = "veldr-server-agent", path = "../server/agent", optional = true }
common = { package = "veldr-common", path = "../common" }
common-base = { package = "veldr-common-base", path = "../common/base" }
common-net = { package = "veldr-common-net", path = "../common/net" }
veldr-query-server = { path = "../common/query_server" }
common-frontend = { package = "veldr-common-frontend", path = "../common/frontend" }
world = { package = "veldr-world", path = "../world", optional = true }

tokio = { workspace = true, features = ["rt-multi-thread"] }
num_cpus = "1.0"
cansi = "2.2.1"
clap = { workspace = true }
crossterm = "0.29"
lazy_static = { workspace = true }
signal-hook = { workspace = true }
shell-words = "1.0.0"
tracing = { workspace = true }
ron = { workspace = true }
serde = { workspace = true, features = ["rc", "derive"] }
ratatui = { version = "0.30.0", features = ["crossterm"] }
rand = { workspace = true }
# ECS
specs = { workspace = true }

#HTTP
axum = { version = "0.8" }
hyper = "1"
http-body-util = "0.1"
prometheus = { workspace = true }
chrono = { workspace = true }

[target.'cfg(windows)'.dependencies]
mimalloc = { workspace = true }

[[bin]]
name = "caldrayne-server-cli"
path = "src/main.rs"
