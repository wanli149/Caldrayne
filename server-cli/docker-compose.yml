services:
  game-server:
    build:
      context: ..
      dockerfile: server-cli/Dockerfile
    image: caldrayne/server-cli:local
    command: ["--no-auth"]
    stdin_open: true
    tty: true
    container_name: caldrayne-game-server-local
    ports:
      - "14004:14004"
      - "14006:14006/udp"
    # Keep the server-cli web UI internal by default; it binds to container
    # localhost unless you provide a custom server-cli/settings.ron.
    restart: on-failure:0
    volumes:
      - "./userdata:/opt/userdata"
    environment:
      - RUST_LOG=debug,common::net=info
